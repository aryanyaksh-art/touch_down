[project]
name = "touchdown"
version = "0.1.0"
description = "Recreation of OSIRIS-REx autonomous touch-and-go at Bennu: Natural Feature Tracking, hazard-map back-away, and a neural hazard-detector extension"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aryan Yaksh" }]
keywords = ["osiris-rex", "bennu", "autonomous navigation", "natural feature tracking", "kalman filter", "hazard detection", "space robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "pyyaml",
    "matplotlib",
    "pillow",
    "requests",
]

[project.urls]
Homepage = "https://aryanyaksh-art.github.io/touch_down/"
Repository = "https://github.com/aryanyaksh-art/touch_down"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["touchdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
